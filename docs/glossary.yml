MVVM: "Model-View-ViewModel, a pattern that keeps UI code (the view) apart from presentation logic (the view model) and data (the model)."
ReactiveObject: "The ReactiveUI base class for view models and models. It raises property change notifications and exposes them as observables."
ReactiveCommand: "A ReactiveUI command that runs synchronous or asynchronous work, reports whether it can run, and exposes its results, errors and busy state as observables."
ObservableAsPropertyHelper: "A ReactiveUI helper, often called OAPH, that turns an observable into a read-only property that raises change notifications."
WhenAnyValue: "A ReactiveUI operator that turns one or more properties into an observable that emits each time any of them changes."
IViewFor: "The ReactiveUI interface a view implements to declare the view model type it displays."
RoutingState: "The ReactiveUI navigation stack used by view-model-first routing."
IScheduler: "The System.Reactive abstraction that decides where and when observable work runs, for example on the UI thread or a background thread."
Splat: "The ReactiveUI service locator and logging library that ReactiveUI uses to register and resolve services across platforms."
Akavache: "An asynchronous, persistent key-value cache for .NET apps, built on SQLite and Reactive Extensions."
Rx: "Reactive Extensions, a library for composing asynchronous and event-based programs with observable sequences and LINQ-style operators."
